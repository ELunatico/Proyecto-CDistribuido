services:
  db_postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: churn_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churn_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  load_balancer:
    build: ./load_balancer_go
    ports:
      - "9000:9000"

  middleware:
    build: ./middleware_go
    ports:
      - "8080:8080"
    depends_on:
      db_postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"

  worker_a1:
    build: ./worker_a
  worker_a2:
    build: ./worker_a
  worker_a3:
    build: ./worker_a

  worker_b1:
    build: ./worker_b
  worker_b2:
    build: ./worker_b
  worker_b3:
    build: ./worker_b

  worker_c1:
    build: ./worker_c
  worker_c2:
    build: ./worker_c
  worker_c3:
    build: ./worker_c